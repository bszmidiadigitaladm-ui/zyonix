[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Send anyone who lands on the raw netlify.app subdomain to the real domain.
# Host-matched, so branch/deploy-preview subdomains (e.g. main--zyonix.netlify.app)
# are unaffected — only the exact zyonix.netlify.app host redirects.
[[redirects]]
  from = "https://zyonix.netlify.app/*"
  to = "https://zyonix.pro/:splat"
  status = 301
  force = true

# Netlify's native Scheduled Functions feature targets standalone Netlify Functions,
# not Next.js API routes served through the Next runtime plugin. To run the daily
# devotional job (src/app/api/cron/daily-devotional/route.ts), point an external
# scheduler (GitHub Actions cron workflow, cron-job.org, or Supabase pg_cron + pg_net)
# at that URL once a day with header "Authorization: Bearer $CRON_SECRET" — see README.md.
#
# Cron jobs are configured via cron-job.org against https://zyonix.pro/api/cron/*.
